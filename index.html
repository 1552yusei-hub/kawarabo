<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カワラボ手帳｜KAWAII LAB. 予定管理</title>
<meta name="description" content="KAWAII LAB. 5グループ＋研究生2チームの予定を、推しごとに追える手帳。">
<meta name="theme-color" content="#FBF9FD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF9FD; --card:#FFFFFF;
  --ink:#171225; --ink2:#5F5870; --ink3:#79718A;
  --line:#E8E3F0; --line2:#D6CEE4;
  --pink:#FF2E7E; --pink-ink:#C4005A; --pink-soft:#FFE8F1;
  --lav:#F2EDFB; --rail:#F7F3FE;
  --shadow:0 10px 30px -18px rgba(23,18,37,.45);
  --r:16px;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color-scheme: light;
}
html[data-theme="dark"]{
  --paper:#0F0B16; --card:#191322;
  --ink:#F4F0FA; --ink2:#CEC6DC; --ink3:#A79EBA;
  --line:#2A2336; --line2:#3B3249;
  --pink:#FF5C97; --pink-ink:#FF8FB5; --pink-soft:#3A1224;
  --lav:#221B2E; --rail:#1F1830;
  --shadow:0 14px 34px -20px rgba(0,0,0,.9);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--f-body); color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(color-mix(in srgb, var(--ink) 5%, transparent) 1px,transparent 1px);
  background-size:100% 28px;
  line-height:1.55; -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease,color .25s ease;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--pink-ink);text-decoration-thickness:1px;text-underline-offset:2px}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:6px}
.app{max-width:940px;margin:0 auto;padding:0 16px;min-height:100vh}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 0 10px;background:linear-gradient(var(--paper) 74%,transparent)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;flex:none;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:-.04em}
.brand-name{font-family:var(--f-display);font-weight:900;font-size:16px;line-height:1.1}
.brand-sub{font-size:10.5px;color:var(--ink3);letter-spacing:.1em}
.icon-btn{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);transition:transform .15s}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.icon-btn svg{width:18px;height:18px}
.who{font-size:11px;color:var(--ink2);background:var(--lav);padding:5px 10px;border-radius:999px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* hero */
.hero{position:relative;background:var(--ink);color:var(--paper);border-radius:22px;padding:20px;overflow:hidden;margin-bottom:14px}
html[data-theme="dark"] .hero{background:linear-gradient(140deg,#2A1040,#150E1F 60%)}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,46,126,.95),rgba(255,46,126,0) 68%);pointer-events:none}
.hero-eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.62);display:flex;align-items:center;gap:8px}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--pink)}
.hero-main{display:flex;align-items:flex-end;gap:14px;margin-top:6px;flex-wrap:wrap}
.hero-date{font-family:var(--f-display);font-weight:900;font-size:clamp(42px,12vw,60px);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-date small{font-size:.34em;font-weight:700;margin-left:6px;color:rgba(255,255,255,.72)}
.hero-sub{font-size:12.5px;color:rgba(255,255,255,.7);padding-bottom:6px}
.hero-stats{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;letter-spacing:.1em;color:rgba(255,255,255,.6)}
.hero-remind{margin-top:14px;background:rgba(255,46,126,.18);border:1px solid rgba(255,46,126,.45);border-radius:12px;padding:9px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.hero-remind b{color:#FFC2D9}
.hero-remind a{color:#fff;text-decoration:underline;text-underline-offset:3px}

/* section */
.sec{display:flex;align-items:baseline;gap:10px;margin:20px 0 10px}
.sec h2{font-family:var(--f-display);font-weight:900;font-size:17px}
.sec .count{font-size:11.5px;color:var(--ink3)}
.sec .spacer{margin-left:auto}
.sec .mini{font-size:11.5px;color:var(--ink3);margin-left:auto}

/* filters */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--line2)}
.chip .swatch{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink3))}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
html[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#1A0C14}

/* ticket card */
.cards{display:flex;flex-direction:column;gap:10px}
.card{position:relative;display:grid;grid-template-columns:64px 1fr;background:var(--card);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%;transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2)}
.card::before,.card::after{content:"";position:absolute;left:56px;width:14px;height:14px;border-radius:50%;background:var(--paper)}
.card::before{top:-8px}.card::after{bottom:-8px}
.rail{padding:12px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-right:1px dashed var(--line2);border-radius:var(--r) 0 0 var(--r);background:var(--rail)}
.rail .m{font-size:10px;letter-spacing:.06em;color:var(--ink3);font-weight:500}
.rail .d{font-family:var(--f-display);font-weight:900;font-size:25px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
html[data-theme="dark"] .rail{background:#251C33}
html[data-theme="dark"] .rail .d{color:#FFFFFF}
html[data-theme="dark"] .rail .m,html[data-theme="dark"] .rail .w{color:#D8D0E6}
html[data-theme="dark"] .dayhead .dnum{color:#FFFFFF}
html[data-theme="dark"] .hero-date small{color:#E6DFF2}
html[data-theme="dark"] .days{color:#C9C0D8}
html[data-theme="dark"] .meta{color:#CFC7DD}
html[data-theme="dark"] .gate .foot{color:#A79EBA}
html[data-theme="dark"] .field label{color:#CFC7DD}
html[data-theme="dark"] .note{color:#CFC7DD}
.rail .w{font-size:10px;color:var(--ink3);font-weight:500}
.rail .w.sun{color:#D64545}html[data-theme="dark"] .rail .w.sun{color:#FF8B8B}
.rail .w.sat{color:#3D6FD0}html[data-theme="dark"] .rail .w.sat{color:#8FB4FF}
.body{padding:11px 14px 12px;min-width:0}
.card-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:5px;padding-right:24px}
.gchip{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 26%,var(--card));white-space:nowrap}
html[data-theme="dark"] .gchip{background:color-mix(in srgb,var(--c) 22%,var(--card));border-color:color-mix(in srgb,var(--c) 45%,var(--card))}
.tchip{font-size:10px;font-weight:700;color:var(--ink2);background:var(--lav);border-radius:5px;padding:2px 6px}
.tchip.live{background:var(--pink-soft);color:var(--pink-ink)}
.title{font-size:14.5px;font-weight:700;line-height:1.42}
.meta{display:flex;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:5px}
.meta .t{font-weight:700;color:var(--ink)}
.meta .t.unknown{font-weight:500;color:var(--ink3)}
.star{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);transition:all .15s}
.star:hover{background:var(--pink-soft);color:var(--pink)}
.star svg{width:16px;height:16px}
.star.on{color:var(--pink)}
.star.on svg{fill:var(--pink)}
.days{position:absolute;right:11px;bottom:10px;font-size:10px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.days.soon{color:var(--pink-ink);background:var(--pink-soft);padding:2px 7px;border-radius:999px}
.card.past{opacity:.5}
.card.oshi-hit{border-color:color-mix(in srgb,var(--pink) 45%,var(--line))}

/* daygroup */
.daygroup{margin-bottom:16px}
.dayhead{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.dayhead .dnum{font-family:var(--f-display);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.dayhead .dsub{font-size:11px;color:var(--ink3)}
.dayhead .rule{flex:1;height:1px;background:var(--line)}
.dayhead .today-tag{font-size:9.5px;font-weight:700;color:#fff;background:var(--pink);padding:2px 6px;border-radius:999px;letter-spacing:.06em}

/* empty */
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:24px 18px;text-align:center;background:var(--card)}
.empty .etitle{font-family:var(--f-display);font-weight:900;font-size:15px;margin-bottom:4px}
.empty p{font-size:12.5px;color:var(--ink2);max-width:36em;margin:0 auto}
.empty .star-demo{color:var(--pink);font-size:22px;line-height:1;margin-bottom:8px}

/* oshi */
.oshi-hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.oshi-hero::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--pink),#8B5BD6)}
.oshi-hero .oh-name{font-family:var(--f-display);font-weight:900;font-size:20px;margin:2px 0 2px;padding-left:4px}
.oshi-hero .oh-sub{font-size:12px;color:var(--ink2);padding-left:4px}
.member-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.member-row::-webkit-scrollbar{display:none}
.mem{flex:none;width:78px;text-align:center}
.mem .face{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:19px;color:#fff;background:var(--c,#888);box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
.mem .nm{font-size:10.5px;line-height:1.3;color:var(--ink2);display:block}
.mem .gr{font-size:9px;color:var(--ink3);display:block}
.oshi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.opick{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:9px 6px 8px;text-align:center;transition:all .15s;position:relative}
.opick:hover{border-color:var(--line2);transform:translateY(-1px)}
.opick .face{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:16px;color:#fff;background:var(--c,#888)}
.opick .nm{font-size:10.5px;line-height:1.3;display:block;color:var(--ink)}
.opick .gr{font-size:9px;color:var(--ink3);display:block}
.opick[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 0 2px color-mix(in srgb,var(--pink) 30%,transparent)}
.opick[aria-pressed="true"]::after{content:"✓";position:absolute;top:5px;right:6px;width:16px;height:16px;border-radius:50%;background:var(--pink);color:#fff;font-size:10px;line-height:16px;font-weight:700}
.gsec{margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.gsec .bar{width:4px;height:15px;border-radius:2px;background:var(--c)}
.gsec .gname{font-family:var(--f-display);font-weight:900;font-size:14px}
.gsec .gnum{font-size:10.5px;color:var(--ink3)}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.panel h3{font-family:var(--f-display);font-weight:900;font-size:15.5px;margin-bottom:4px}
.panel .lead{font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px}
.steps .no{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.steps b{display:block;font-size:13px;margin-bottom:2px}
.steps p{font-size:12px;color:var(--ink2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:12.5px;font-weight:500;transition:all .15s}
.btn:hover{background:var(--lav)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--pink-ink);border-color:var(--pink-ink);color:#fff}
.btn.danger{color:#D64545;border-color:color-mix(in srgb,#D64545 30%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.prompt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.8px;line-height:1.65;background:var(--lav);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;color:var(--ink2)}
textarea{width:100%;min-height:110px;resize:vertical;padding:12px;border-radius:12px;border:1px solid var(--line2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6;background:var(--paper);color:var(--ink)}
.note{font-size:11.5px;color:var(--ink2);background:var(--lav);border-radius:10px;padding:10px 12px;margin-top:12px}
.note b{color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink3)}
.kv b{font-weight:500}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.switch .lab{font-size:12.5px}
.switch .sub{font-size:11px;color:var(--ink3)}
.tgl{width:46px;height:26px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tgl[aria-pressed="true"]{background:var(--pink)}
.tgl[aria-pressed="true"]::after{transform:translateX(20px)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:9.5px;font-weight:500;color:var(--ink3);transition:color .15s}
.tabbar svg{width:20px;height:20px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{stroke:var(--pink)}
main{padding-bottom:110px}
.view[hidden]{display:none}

/* FAB */
.fab{position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:45;width:52px;height:52px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px -6px rgba(255,46,126,.7),0 0 0 3px color-mix(in srgb,var(--card) 85%,transparent);transition:transform .15s}
.fab:hover{transform:scale(1.06)}
.fab:active{transform:scale(.95)}
.fab svg{width:24px;height:24px;transition:transform .5s}
.fab.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fab .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:700;display:none;place-items:center;padding:0 4px}
.fab .badge.show{display:grid}

/* modal */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(15,11,22,.5);backdrop-filter:blur(3px)}
.modal.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;margin-bottom:12px}
.sheet-head h3{font-family:var(--f-display);font-weight:900;font-size:17px}
.sheet-head .icon-btn{margin-left:auto;width:32px;height:32px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:5px;letter-spacing:.04em}
.field input,.field select{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:14px;font-family:inherit;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick button{font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink2)}
.gpick button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.detail-body .dtit{font-family:var(--f-display);font-weight:900;font-size:19px;line-height:1.4;margin:6px 0 10px}
.detail-rows{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.drow{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:13px}
.drow dt{color:var(--ink3);font-size:11.5px;padding-top:2px}
.drow dd{margin:0}
.toast{position:fixed;left:50%;bottom:140px;transform:translate(-50%,14px);background:var(--ink);color:var(--paper);font-size:12.5px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .22s;z-index:90;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* gate */
.gate{position:fixed;inset:0;z-index:100;display:none;overflow:auto;background:var(--paper);
  background-image:radial-gradient(600px 380px at 80% -10%,color-mix(in srgb,var(--pink) 22%,transparent),transparent 70%),radial-gradient(520px 340px at 0% 100%,color-mix(in srgb,#8B5BD6 18%,transparent),transparent 70%)}
.gate.open{display:block}
.gate-in{max-width:420px;margin:0 auto;padding:40px 22px 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.gate .mark{width:46px;height:46px;font-size:19px;border-radius:13px;margin-bottom:18px}
.gate h1{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.25;letter-spacing:-.01em}
.gate .gl{font-size:13px;color:var(--ink2);margin:8px 0 22px}
.gate .card-form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.gate .err{font-size:12px;color:#D64545;margin-top:8px;min-height:16px}
.gate .foot{font-size:11px;color:var(--ink3);margin-top:18px;text-align:center;line-height:1.7}

/* =========================================================
   クラウド接続（Supabase / 無料）
   URLとキーを設定画面から貼るだけで有効になります。
   未設定のときは「この端末だけモード」で動きます。
   ========================================================= */
const cloud = {
  cfg: function(){
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE + '.cloud') || 'null'); } catch(e){ saved = null; }
    if (saved && saved.url && saved.key) return saved;
    var d = (typeof CONFIG !== 'undefined') ? CONFIG : {};
    if (d.cloudUrl && d.cloudKey) return { url:this.normUrl(d.cloudUrl), key:d.cloudKey, builtin:true };
    return null;
  },
  /* URLの末尾が /rest/v1 でも / でも、正しい形に直す */
  normUrl: function(u){
    var s = String(u || '').trim();
    if (!s) return '';
    s = s.replace(/\/+$/, '');
    s = s.replace(/\/rest\/v1$/i, '');
    s = s.replace(/\/+$/, '');
    if (s && !/^https?:\/\//i.test(s)) s = 'https://' + s;
    return s;
  },
  saveCfg: function(url, key){
    var c = { url:this.normUrl(url), key:String(key || '').trim() };
    if (!c.url || !c.key) localStorage.removeItem(STORE + '.cloud');
    else localStorage.setItem(STORE + '.cloud', JSON.stringify(c));
  },
  isBuiltin: function(){ return !!(this.cfg() && this.cfg().builtin); },
  on: function(){
    var c = this.cfg();
    return !!(c && c.url && c.key);
  },
  keyType: function(k){
    k = String(k || '');
    if (k.indexOf('sb_publishable_') === 0) return 'publishable';
    if (k.indexOf('sb_secret_') === 0) return 'secret';
    if (k.indexOf('eyJ') === 0) return 'legacy';
    return 'unknown';
  },
  rpc: function(fn, args){
    var c = this.cfg();
    if (!c) return Promise.reject(new Error('クラウド未接続'));
    var t = this.keyType(c.key);
    if (t === 'secret') {
      return Promise.reject(new Error('秘密キー（sb_secret_）は使えません。publishable キーを入れてください'));
    }
    var headers = { 'Content-Type':'application/json', 'apikey':c.key };
    /* 新しいキー（sb_publishable_）は JWT ではないので Authorization に載せると 401 になります */
    if (t === 'legacy') headers['Authorization'] = 'Bearer ' + c.key;
    return fetch(c.url + '/rest/v1/rpc/' + fn, {
      method:'POST', headers:headers, body: JSON.stringify(args || {})
    }).then(function(r){
      return r.text().then(function(txt){
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch(e){ data = txt; }
        if (!r.ok) {
          var msg = (data && (data.message || data.hint || data.details || data.error)) || ('HTTP ' + r.status);
          throw new Error(msg);
        }
        return data;
      });
    });
  }
};

const $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

const NOW = new Date();
const TODAY_S = ymd(NOW);

function pad(n){ return String(n).padStart(2, '0'); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseD(s){ var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function daysFrom(s){
  var t = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  return Math.round((parseD(s) - t) / 86400000);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function hash(s){
  var h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return String(h >>> 0);
}
function sortEv(a, b){
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  return (a.time || '99:99') < (b.time || '99:99') ? -1 : 1;
}
function evKey(ev){ return ev.date + '|' + ev.title; }
function save(){
  try {
    localStorage.setItem(STORE, JSON.stringify({ v:3, events:events, me:me, lastRefresh:lastRefresh }));
  } catch(e){}
}
function load(){
  var raw = null;
  try { raw = localStorage.getItem(STORE); } catch(e){}
  if (raw) {
    try {
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.events) && d.events.length) events = d.events;
      if (d && d.me) me = d.me;
      if (d && d.lastRefresh) lastRefresh = d.lastRefresh;
    } catch(e){}
  }
  if (!events.length) events = SEED.map(function(e){ return Object.assign({}, e); });
  if (me) {
    if (!Array.isArray(me.atts)) me.atts = [];
    if (!Array.isArray(me.oshi)) me.oshi = [];
  }
}

/* ---------- 参戦予定 ---------- */
function isAttending(key){
  return !!(me && me.atts && me.atts.some(function(a){ return a.key === key; }));
}
function snapshot(ev){
  return { key:evKey(ev), date:ev.date, title:ev.title, time:ev.time || '', open:ev.open || '',
           venue:ev.venue || '', groups:(ev.groups || []).slice(), type:ev.type || 'live' };
}
function toggleAttend(ev){
  if (!me) { openGate(); return; }
  var key = evKey(ev);
  var i = me.atts.findIndex(function(a){ return a.key === key; });
  var adding = i < 0;
  if (adding) me.atts.push(snapshot(ev)); else me.atts.splice(i, 1);
  save(); renderAll();
  toast(adding ? '参戦予定に追加しました' : '参戦予定から外しました');
  if (cloud.on() && me.token) {
    var call = adding
      ? cloud.rpc('attend_add', { p_token:me.token, p_key:key, p_date:ev.date, p_title:ev.title,
          p_time:ev.time || '', p_venue:ev.venue || '', p_groups:ev.groups || [], p_open:ev.open || '', p_type:ev.type || 'live' })
      : cloud.rpc('attend_del', { p_token:me.token, p_key:key });
    call.catch(function(err){ toast('同期できませんでした：' + err.message); });
  }
}

/* ---------- 推し ---------- */
function oshiMembers(){ return (me && me.oshi ? me.oshi : []).map(function(id){ return MEMBYID[id]; }).filter(Boolean); }
function oshiGroups(){
  var s = new Set();
  oshiMembers().forEach(function(m){ s.add(m.g); });
  return s;
}
function isOshiEvent(ev){
  var og = oshiGroups();
  if (!og.size) return false;
  return (ev.groups || []).some(function(g){ return og.has(g); });
}

   共通パーツ
   ========================================================= */
function groupChips(gs, max){
  max = max || 2;
  var html = (gs || []).slice(0, max).map(function(k){
    var g = GROUPS[k]; if (!g) return '';
    return '<span class="gchip" style="--c:' + g.color + '">' + esc(g.short) + '</span>';
  }).join('');
  if ((gs || []).length > max) html += '<span class="gchip" style="--c:#6B6478">+' + (gs.length - max) + '</span>';
  return html;
}
function timeLabel(ev){
  if (ev.time) return '<span class="t">' + esc(ev.time) + ' 開演</span>' + (ev.open ? '<span>' + esc(ev.open) + ' 開場</span>' : '');
  return '<span class="t unknown">時間未定</span>' + (ev.open ? '<span>' + esc(ev.open) + ' 開場</span>' : '');
}
function daysLabel(ev){
  var d = daysFrom(ev.date);
  if (d < 0) return { txt:'終了', soon:false };
  if (d === 0) return { txt:'今日', soon:true };
  if (d === 1) return { txt:'明日', soon:true };
  return { txt:'あと' + d + '日', soon:d <= 3 };
}
function cardHTML(ev, opts){
  opts = opts || {};
  var d = parseD(ev.date);
  var g = GROUPS[(ev.groups || [])[0]] || { color:'#9A93A8' };
  var dl = daysLabel(ev);
  var on = isAttending(evKey(ev));
  var meta = [timeLabel(ev)];
  if (ev.venue) meta.push('<span>' + esc(ev.venue) + '</span>');
  var cls = 'card' + (daysFrom(ev.date) < 0 ? ' past' : '') + (isOshiEvent(ev) ? ' oshi-hit' : '');
  return '<div class="' + cls + '" role="button" tabindex="0" data-id="' + esc(ev.id || evKey(ev)) + '" style="--c:' + g.color + '">' +
    '<div class="rail"><span class="m">' + (d.getMonth() + 1) + '月</span>' +
      '<span class="d">' + d.getDate() + '</span>' +
      '<span class="w ' + (d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : '') + '">' + WEEK[d.getDay()] + '</span></div>' +
    '<div class="body"><div class="card-top">' + groupChips(ev.groups, 2) +
        '<span class="tchip ' + ev.type + '">' + (TYPES[ev.type] || '予定') + '</span></div>' +
      '<div class="title">' + esc(ev.title) + '</div>' +
      '<div class="meta">' + meta.join('') + '</div></div>' +
    '<button class="star ' + (on ? 'on' : '') + '" data-att="' + esc(ev.id || evKey(ev)) + '" aria-label="参戦予定" aria-pressed="' + on + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg></button>' +
    (opts.days === false ? '' : '<span class="days ' + (dl.soon ? 'soon' : '') + '">' + dl.txt + '</span>') +
  '</div>';
}
function emptyHTML(title, text, extra){
  return '<div class="empty"><div class="star-demo">☆</div><div class="etitle">' + esc(title) + '</div><p>' + esc(text) + '</p>' + (extra || '') + '</div>';
}
function byDate(list){
  var o = {};
  list.forEach(function(e){ (o[e.date] = o[e.date] || []).push(e); });
  return o;
}
function datedGroups(list, todayTag){
  var o = byDate(list);
  return Object.keys(o).sort().map(function(date){
    var d = parseD(date), n = daysFrom(date);
    return '<div class="daygroup"><div class="dayhead">' +
      '<span class="dnum">' + (d.getMonth() + 1) + '月' + d.getDate() + '日</span>' +
      '<span class="dsub">' + WEEK[d.getDay()] + '曜日</span><span class="rule"></span>' +
      (todayTag && n === 0 ? '<span class="today-tag">TODAY</span>' : '') +
      '</div><div class="cards">' + o[date].sort(sortEv).map(function(e){ return cardHTML(e, { days:false }); }).join('') + '</div></div>';
  }).join('');
}
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

        : 'いまは「この端末だけモード」です。同じ端末の中でだけ保存されます。') + '</p>' +
    '</div>' +
    '<p class="foot">予定は管理者が更新します。あなたの推し・参戦予定は<br>フレンドにだけ見えます。</p>' +
  '</div>';

  $$('#gate [data-gm]').forEach(function(b){
    b.addEventListener('click', function(){ gateMode = b.dataset.gm; renderGate(); });
  });
  $('#gateForm').addEventListener('submit', function(e){
    e.preventDefault();
    var nick = $('#gNick').value.trim();
    var pw = $('#gPass').value;
    var err = $('#gErr');
    if (!nick) { err.textContent = 'ニックネームを入れてください'; return; }
    if (pw.length < 4) { err.textContent = 'パスワードは4文字以上にしてください'; return; }
    if (gateMode === 'signup' && pw !== $('#gPass2').value) { err.textContent = 'パスワードが一致しません'; return; }

    var btn = $('#gSubmit');
    btn.disabled = true; btn.textContent = '確認中…';
    err.textContent = '';

    if (cloud.on()) {
      var fn = gateMode === 'signup' ? 'signup' : 'login';
      cloud.rpc(fn, { p_nick:nick, p_pass:pw }).then(function(res){
        var p = Array.isArray(res) ? res[0] : res;
        if (!p || !p.token) throw new Error('ログインできませんでした');
        me = { nick:p.nick || nick, token:p.token, oshi:p.oshi || [], atts:p.atts || [] };
        save(); closeGate(); syncChrome(); renderAll();
        if (!me.oshi.length) startOnboarding();
        else { toast(me.nick + 'さん、おかえりなさい'); maybeNotify(); }
      }).catch(function(e2){
        btn.disabled = false; btn.textContent = gateMode === 'signup' ? '作成してはじめる' : 'ログインする';
        err.innerHTML = esc(friendlyErr(e2.message)) + '<br><span style="font-size:10.5px;color:var(--ink3)">詳細: ' + esc(String(e2.message || '').slice(0, 160)) + '</span>';
      });
      return;
    }

    var users = readUsers();
    if (gateMode === 'signup') {
      if (users[nick]) { btn.disabled = false; btn.textContent = '作成してはじめる'; err.textContent = 'そのニックネームはこの端末で使われています'; return; }
      users[nick] = { hash:hash(pw), oshi:[], atts:[] };
      writeUsers(users);
      me = { nick:nick, token:'local', oshi:[], atts:[] };
      save(); closeGate(); startOnboarding(); return;
    }
    var u = users[nick];
    if (!u || u.hash !== hash(pw)) {
      btn.disabled = false; btn.textContent = 'ログインする';
      err.textContent = 'ニックネームかパスワードが違います';
      return;
    }
    me = { nick:nick, token:'local', oshi:u.oshi || [], atts:u.atts || [] };
    save(); closeGate(); syncChrome(); renderAll(); toast(nick + 'さん、おかえりなさい');
  });
}
function friendlyErr(m){
  m = String(m || '');
  if (/digest\(text/i.test(m)) return 'サーバーのSQLに不具合があります。「supabase-fix.sql」を実行してください';
  if (/duplicate|unique/i.test(m)) return 'そのニックネームはすでに使われています';
  if (/Could not find the function|function .* does not exist/i.test(m)) return 'サーバーの準備ができていません（SQLの実行が必要です）';
  if (/JWT|Invalid API key|401/i.test(m)) return 'キーが違います。publishable キーをコピーし直してください';
  if (/ニックネーム|パスワード/i.test(m)) return m;
  return m;
}
function persistMe(){
  if (!me) return;
  save();
  if (cloud.on() && me.token && me.token !== 'local') {
    cloud.rpc('set_oshi', { p_token:me.token, p_oshi:me.oshi }).catch(function(){});
  } else {
    var users = readUsers();
    if (users[me.nick]) {
      users[me.nick].oshi = me.oshi;
      users[me.nick].atts = me.atts;
      writeUsers(users);
    }
  }
}

let obPicked = new Set();
function startOnboarding(){
  obPicked = new Set(me && me.oshi ? me.oshi : []);
  renderOshiPicker(true);
  $('#gate').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function renderOshiPicker(first){
  var html = '<div class="gate-in" style="max-width:640px">';
  html += '<div class="mark">KL</div>';
  html += '<h1 style="font-size:23px">' + (first ? '推しを選ぼう' : '推しを変更') + '</h1>';
  html += '<p class="gl" style="margin-bottom:12px">何人でも選べます。あとから設定でいつでも変えられます。</p>';
  html += '<div class="searchbar"><input id="obSearch" placeholder="名前で検索（例：まな）" autocomplete="off"></div>';
  html += '<div id="obList"></div>';
  html += '<div class="btns" style="margin-top:18px"><button class="btn primary" id="obSave" style="flex:1;justify-content:center">' +
          (obPicked.size ? obPicked.size + '人を推しに設定' : 'あとで決める') + '</button></div>';
  html += '<p class="foot">推しに設定すると、そのグループの予定が「推し」タブに集まります。</p></div>';
  $('#gate').innerHTML = html;

  function paint(q){
    q = (q || '').trim();
    var out = '';
    GKEYS.forEach(function(k){
      var g = GROUPS[k];
      var ms = MEMBERS.filter(function(m){ return m.g === k && (!q || m.n.indexOf(q) >= 0 || g.short.indexOf(q) >= 0); });
      if (!ms.length) return;
      out += '<div class="gsec" style="--c:' + g.color + '"><span class="bar"></span>' +
             '<span class="gname">' + esc(g.name) + '</span><span class="gnum">' + ms.length + '人</span></div>';
      out += '<div class="oshi-grid">' + ms.map(function(m){
        return '<button class="opick" data-ob="' + m.id + '" aria-pressed="' + obPicked.has(m.id) + '" style="--c:' + m.c + '">' +
          '<span class="face">' + esc(m.n.slice(0, 1)) + '</span>' +
          '<span class="nm">' + esc(m.n) + '</span>' +
          '<span class="gr">' + esc(g.short) + '</span></button>';
      }).join('') + '</div>';
    });
    $('#obList').innerHTML = out || '<div class="empty" style="margin-top:12px"><p>見つかりませんでした</p></div>';
  }
  paint('');
  $('#obSearch').addEventListener('input', function(){ paint(this.value); });

  $('#gate').addEventListener('click', function(e){
    var b = e.target.closest('[data-ob]');
    if (!b) return;
    var id = b.dataset.ob;
    if (obPicked.has(id)) obPicked.delete(id); else obPicked.add(id);
    b.setAttribute('aria-pressed', obPicked.has(id));
    var btn = $('#obSave');
    if (btn) btn.textContent = obPicked.size ? obPicked.size + '人を推しに設定' : 'あとで決める';
  });
  $('#obSave').addEventListener('click', function(){
    if (!me) me = { nick:'ゲスト', token:'local', oshi:[], atts:[] };
    me.oshi = Array.from(obPicked);
    persistMe();
    closeGate();
    syncChrome(); renderAll();
    if (me.oshi.length && 'Notification' in window && Notification.permission === 'default') {
      try { Notification.requestPermission(); } catch(e){}
    }
    toast(me.oshi.length ? me.oshi.length + '人を推しに設定しました' : '推しはあとから設定できます');
  });
}

  html += next.length ? datedGroups(next) : '<div class="empty"><p>7日以内の予定は登録されていません。</p></div>';

    html += '<div class="panel"><h3>返事待ち</h3>' + friends.outgoing.map(function(f){

function bindFriendUI(){
  var raw = $('#freqSend');
  if (raw) raw.addEventListener('click', function(){
    var v = $('#freqNick').value.trim();
    if (!v) return;
    cloud.rpc('friend_request', { p_token:me.token, p_target:v }).then(function(r){
      $('#freqMsg').textContent = r === 'ok' ? '申請しました。相手の承認を待ちましょう。' : String(r);
      loadFriends();
    }).catch(function(e){ $('#freqMsg').textContent = '送れませんでした：' + friendlyErr(e.message); });
  });
  $$('#view-attend [data-facc]').forEach(function(b){
    b.addEventListener('click', function(){
      cloud.rpc('friend_respond', { p_token:me.token, p_from:b.dataset.facc, p_action:'accept' })
        .then(loadFriends).catch(function(e){ toast(e.message); });
    });
  });
  $$('#view-attend [data-frej]').forEach(function(b){
    b.addEventListener('click', function(){
      cloud.rpc('friend_respond', { p_token:me.token, p_from:b.dataset.frej, p_action:'reject' })
        .then(loadFriends).catch(function(e){ toast(e.message); });
    });
  });
  var go = $('#goCloud');
  if (go) go.addEventListener('click', function(){ setView('set'); });
}
function loadFriends(){
  if (!cloud.on() || !me || !me.token || me.token === 'local') { friends = { list:[], incoming:[], outgoing:[], board:[], err:'' }; return; }
  Promise.all([
    cloud.rpc('friend_list', { p_token:me.token }),
    cloud.rpc('friend_board', { p_token:me.token })
  ]).then(function(res){
    var l = res[0] || [], b = res[1] || [];
    friends = {
      list: l.filter(function(x){ return x.dir === 'friend'; }),
      incoming: l.filter(function(x){ return x.dir === 'in'; }),
      outgoing: l.filter(function(x){ return x.dir === 'out'; }),
      board: Array.isArray(b) ? b : [],
      err:''
    };
    renderAttend();
  }).catch(function(e){ friends.err = e.message; });
}

/* ---------- 更新 ---------- */
function doRefresh(){
  var fab = $('#fabRefresh');
  fab.classList.add('spin');
  fetch(CONFIG.dataUrl + '?t=' + Date.now(), { cache:'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){
      var list = Array.isArray(data) ? data : (data && data.events);
      if (!Array.isArray(list)) throw new Error('データ形式が違います');
      var seen = {};
      events.forEach(function(e){ seen[e.date + '|' + e.title] = e; });
      var added = 0, updated = 0;
      list.forEach(function(o, i){
        if (!o || !o.title || !/^\d{4}-\d{2}-\d{2}$/.test(String(o.date || ''))) return;
        var key = o.date + '|' + o.title;
        var cur = seen[key];
        var rec = normalizeEvent(o, 'r' + Date.now() + '_' + i);
        if (!rec) return;
        if (cur) {
          var ch = false;
          if (o.time && !cur.time) { cur.time = o.time; ch = true; }
          if (o.open && !cur.open) { cur.open = o.open; ch = true; }
          if (o.venue && !cur.venue) { cur.venue = o.venue; ch = true; }
          if (ch) updated++;
        } else { events.push(rec); added++; }
      });
      lastRefresh = Date.now();
      save(); renderAll(); syncChrome();
      fab.classList.remove('spin');
      toast(added || updated ? '更新しました：新規' + added + '件 / 補完' + updated + '件' : '最新の状態です');
    })
    .catch(function(err){
      fab.classList.remove('spin');
      toast('更新できませんでした（' + err.message + '）');
    });
}
function normalizeEvent(o, id){
  var gs = Array.isArray(o.groups) ? o.groups.slice() : (typeof o.groups === 'string' ? o.groups.split(',') : []);
  gs = gs.map(function(x){ return String(x).trim().toUpperCase(); });
  if (gs.indexOf('ALL') >= 0) gs = GKEYS.slice();
  gs = gs.filter(function(g){ return GROUPS[g]; });
  return { id:id, date:String(o.date),
    open:/^\d{2}:\d{2}$/.test(o.open || '') ? o.open : '',
    time:/^\d{2}:\d{2}$/.test(o.time || '') ? o.time : '',
    groups:gs.length ? gs : ['FZ'], type:TYPES[o.type] ? o.type : 'live',
    title:String(o.title), venue:o.venue ? String(o.venue) : '',
    source:o.source ? String(o.source) : '', note:o.note ? String(o.note) : '' };
}
function publishJSON(){
  var out = events.slice().sort(sortEv).map(function(e){
    return { date:e.date, open:e.open, time:e.time, groups:e.groups, type:e.type, title:e.title, venue:e.venue, note:e.note, source:e.source };
  });
  download('events.json', JSON.stringify({ updatedAt:new Date().toISOString(), events:out }, null, 2), 'application/json');
  toast('events.json を書き出しました');
}
function download(name, text, mime){
  var blob = new Blob([text], { type:mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

  });

  document.addEventListener('click', function(e){
    var seg = e.target.closest('[data-seg]');
    if (seg) { attendSeg = seg.dataset.seg; renderAttend(); return; }

    var pick = e.target.closest('[data-pick]');
    if (pick) { var k = pick.dataset.pick; if (picked.has(k)) picked.delete(k); else picked.add(k); renderPicked(); return; }

    var att = e.target.closest('[data-att]');
    if (att) {
      e.preventDefault(); e.stopPropagation();
      var id = att.dataset.att;
      var target = events.find(function(x){ return x.id === id || evKey(x) === id; }) ||
                   (me ? me.atts.find(function(a){ return a.key === id; }) : null);
      if (target) toggleAttend(target);
      if ($('#modalDetail').classList.contains('open')) openDetail(id);
      return;
    }

    var fg = e.target.closest('[data-fg]');
    if (fg) {
      var key = fg.dataset.fg;
      if (key === '__all') filterGroups.clear();
      else if (filterGroups.has(key)) filterGroups.delete(key);
      else filterGroups.add(key);
      renderList(); return;
    }

    var edit = e.target.closest('[data-edit]');
    if (edit) {
      var ev2 = events.find(function(x){ return x.id === edit.dataset.edit; });
      closeSheets();
      if (ev2) setTimeout(function(){ openForm(ev2); }, 80);
      return;
    }
    var del = e.target.closest('[data-del]');
    if (del) {
      if (!isAdmin) { toast('削除は管理者のみです'); return; }
      if (window.confirm('この予定を削除しますか？')) {
        events = events.filter(function(x){ return x.id !== del.dataset.del; });
        save(); closeSheets(); renderAll(); toast('削除しました');
      }
      return;
    }

    var card = e.target.closest('.card');
    if (card && !e.target.closest('a')) { openDetail(card.dataset.id); return; }
    if (e.target.closest('[data-close]')) { closeSheets(); return; }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeSheets();
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.classList.contains('card')) {
      e.preventDefault(); openDetail(document.activeElement.dataset.id);
    }
  });
  $$('.modal').forEach(function(m){ m.addEventListener('click', function(e){ if (e.target === m) closeSheets(); }); });

  $('#eventForm').addEventListener('submit', function(e){
    e.preventDefault();
    if (!isAdmin) { toast('予定の編集は管理者のみです'); return; }
    var title = $('#fTitle').value.trim(), date = $('#fDate').value;
    if (!title || !date) { toast('タイトルと日付を入れてください'); return; }
    var obj = { date:date, time:$('#fTime').value, open:$('#fOpen').value,
      groups:Array.from(picked), type:$('#fType').value, title:title,
      venue:$('#fVenue').value.trim(), source:$('#fSource').value.trim(), note:$('#fNote').value.trim() };
    if (!obj.groups.length) obj.groups = ['FZ'];
    if (editingId) {
      var i = events.findIndex(function(x){ return x.id === editingId; });
      if (i > -1) events[i] = Object.assign(events[i], obj);
    } else {
      obj.id = 'm' + Date.now(); events.push(obj);
    }
    save(); closeSheets(); renderAll(); toast(editingId ? '更新しました' : '追加しました');
    editingId = null;
  });
}

function setView(name){
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + name; });
  $$('.tabbar button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.view === name)); });
  window.scrollTo({ top:0, behavior:'smooth' });
  if (name === 'attend' && attendSeg === 'friends') loadFriends();
}

/* ---------- 起動 ---------- */
load();
var savedTheme = 'light';
try { savedTheme = localStorage.getItem(STORE + '.theme') || 'light'; } catch(e){}
setTheme(savedTheme);
selDate = TODAY_S;
bind();
syncChrome();
renderAll();

if (!me) {
  openGate();
} else {
  syncChrome();
  if (cloud.on() && me.token && me.token !== 'local') loadFriends();
  maybeNotify();
  var stale = !lastRefresh || (Date.now() - lastRefresh) > 6 * 3600 * 1000;
  if (stale) setTimeout(doRefresh, 800);
}
